# 高风险：完整宿主机访问覆盖配置
#
# 启动时必须在“当前 clone 目录”显式叠加本文件：
#   docker compose -f docker-compose.yml -f docker-compose.full-access.yml up -d --build
#
# 该模式等同于把服务器的高权限交给 Agent：
# - 可通过 /host 读写宿主机完整文件系统；
# - 可访问宿主机进程命名空间；
# - 可通过 Docker Socket 控制宿主机全部 Docker 容器；
# - privileged 容器可能进一步获得宿主机级控制能力。
#
# 仅适用于你完全信任此 Agent、其模型供应商、所有 Skills/MCP 和输入内容的场景。

services:
  liveagent:
    # 让 Agent 进程以容器 root 身份运行。
    user: "0:0"

    # 高危：赋予所有 Linux capabilities 并放宽设备限制。
    privileged: true

    # 让容器可看见宿主机进程；仅文件操作并不需要，但完整运维常需要。
    pid: host

    # 复用宿主机网络命名空间。
    network_mode: host

    # 基础 compose 中的 cap_drop / no-new-privileges 会限制完整权限，覆盖为空。
    cap_drop: []
    security_opt: []

    volumes:
      # 宿主机完整根目录，以 /host 路径读写。
      - /:/host:rw,rshared

      # 高危：可管理宿主机所有 Docker 容器、镜像和卷。
      - /var/run/docker.sock:/var/run/docker.sock

      # 保留基础配置中的持久化数据、WebKit UI 状态、AppImage 缓存和独立工作区。
      - ./data:/home/liveagent/.liveagent
      - ./webview-data:/home/liveagent/.local/share/com.xiaofei.liveagent
      - ./appimage:/opt/liveagent
      - ./workspace:/workspace
