services:
  liveagent:
    image: local/liveagent-xvfb-headless:latest
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "pgrep -x liveagent >/dev/null && pgrep -f WebKitWebProcess >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # 默认限制整套 Agent（含 WebKit）最多使用 0.75 核、1 GiB 内存；
    # 可在 .env 中覆盖，繁重任务建议 CPU_LIMIT=1.0。
    mem_limit: ${MEMORY_LIMIT:-1024m}
    mem_reservation: ${MEMORY_RESERVATION:-512m}
    cpus: ${CPU_LIMIT:-0.75}
    pids_limit: 160

    environment:
      DISPLAY: ":99"
      XDG_RUNTIME_DIR: /tmp/runtime-liveagent
      APPIMAGE_EXTRACT_AND_RUN: "1"

      # 服务器仅通过 Gateway 使用：启动后取消映射本地窗口，但保留 WebView/JS 运行。
      LIVEAGENT_HEADLESS: "1"
      LIVEAGENT_VERSION: ${LIVEAGENT_VERSION:-v1.2.3}
      XVFB_SCREEN: ${XVFB_SCREEN:-1200x720x16}

      # WebKitGTK/Xvfb 优化：禁用无显示场景无意义的合成和辅助功能。
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      GTK_A11Y: "none"
      NO_AT_BRIDGE: "1"
      GDK_BACKEND: "x11"

      LIVEAGENT_GATEWAY_URL: ${LIVEAGENT_GATEWAY_URL:-}
      LIVEAGENT_AGENT_ID: ${LIVEAGENT_AGENT_ID:-}
      LIVEAGENT_AGENT_TOKEN: ${LIVEAGENT_AGENT_TOKEN:-}

    volumes:
      # LiveAgent 数据库、聊天历史、Memory 与已安装的 Skills。
      - ./data:/home/liveagent/.liveagent
      # WebKit localStorage：保存 Skills 启用/选择状态及其他本地 UI 设置。
      - ./webview-data:/home/liveagent/.local/share/com.xiaofei.liveagent
      - ./appimage:/opt/liveagent
      - ./workspace:/workspace

    working_dir: /workspace

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 不开放 X11、MCP Bridge 或其他本地端口；Agent 只主动连接 Gateway。
